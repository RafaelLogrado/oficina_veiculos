<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/veiculo_cadastrar.js"defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Home</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Sistema de Gestão de Oficina de Veículos</h1>
        <h2>Cadastro de veículo</h2>

        <form>
            <label for="modelo">Modelo:</label>
            <input type="text" id="modelo" required><br>
            <label for="marca">Marca:</label>
            <input type="text" id="marca" required><br>
            <label for="placa">Placa:</label>
            <input type="text" id="placa" required><br>
            <label for="codRastreador">Cód Rastreador:</label>
            <input type="number" id="codRastreador" required><br>
            <label for="codCliente">Cód Cliente:</label>
            <input type="number" id="codCliente" required><br><br>
            <button id="btn_cadastrar">Cadastrar</button>
        </form>

        <div id="resposta"></div>
    </main>
</body>
</html>
