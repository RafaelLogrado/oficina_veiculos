<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/agendamento_cadastrar.js"defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <title>Home</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Sistema de Gestão de Oficina de Veículos</h1>
        <h2>Cadastro de agendamento</h2>

        <form>
            <label for="data">Data:</label>
            <input type="date" id="data" required><br>
            <label for="hora">Hora:</label>
            <input type="time" id="hora" required><br>
            <label for="tipo">Tipo:</label>
            <select id="tipo">
                <option value="REVISAO">Revisão</option>
                <option value="MANUTENCAO">Manutenção</option>
                <option value="INSTALACAO">Instalação</option>
            </select><br>
            <label for="codVeiculo">Cód Veículo:</label>
            <input type="number" id="codVeiculo" required><br>
            <label for="codCliente">Cód Cliente:</label>
            <input type="number" id="codCliente" required><br><br>
            <button id="btn_cadastrar">Cadastrar</button>
        </form>

        <div id="resposta"></div>
    </main>
</body>
</html>
